version: "3.8"

services:
  miniapps:
    build: .
    container_name: miniapps
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"
    environment:
      # All values below come from your .env file (or host environment) —
      # nothing here defaults to a real hostname, IP, domain, or identity.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MINIAPPS_ALLOWED_USERS=${MINIAPPS_ALLOWED_USERS}
      - MINIAPPS_OWNER_USER_ID=${MINIAPPS_OWNER_USER_ID}
      - MINIAPPS_PUBLIC_ORIGIN=${MINIAPPS_PUBLIC_ORIGIN}
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - GRAFANA_URL=${GRAFANA_URL}
      - ALERTMANAGER_URL=${ALERTMANAGER_URL}
      - UPTIME_KUMA_URL=${UPTIME_KUMA_URL}
      - HASS_URL=${HASS_URL}
      - HASS_TOKEN=${HASS_TOKEN}
      - GITLAB_API_URL=${GITLAB_API_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - HOMELAB_ANSIBLE_PROJECT_ID=${HOMELAB_ANSIBLE_PROJECT_ID:-113}
      - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN}
      - OP_VAULT=${OP_VAULT}
      - OUTLINE_URL=${OUTLINE_URL}
      - OUTLINE_TOKEN=${OUTLINE_API_TOKEN:-}
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - FLEET_HOSTS_JSON=${FLEET_HOSTS_JSON:-}
      - FLEET_SSH_USER=${FLEET_SSH_USER:-}
      - FLEET_LOCAL_HOST=${FLEET_LOCAL_HOST:-}
    volumes:
      # Wiki access (read-only)
      - ${HOME}/.hermes/wiki:/wiki:ro
      # Hermes session DB for model usage stats (read-only)
      - ${HOME}/.hermes/sessions.db:/data/sessions.db:ro
    networks:
      - miniapps-net

networks:
  miniapps-net:
    driver: bridge
